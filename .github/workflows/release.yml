name: Release Build

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  GO_VERSION: "1.24.0"

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Extract tag metadata
        id: meta
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Automated build for ${GITHUB_REF_NAME}"

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            script_arg: ""
            asset_suffix: darwin-arm64.app.zip
          - arch: amd64
            runner: macos-13
            script_arg: amd
            asset_suffix: darwin-amd64.app.zip
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Make scripts executable
        run: chmod +x script/*.sh

      - name: Build macOS app bundle
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          if [ -n "${{ matrix.script_arg }}" ]; then
            ./script/build-app.sh "${{ matrix.script_arg }}"
          else
            ./script/build-app.sh
          fi

      - name: Archive macOS app bundle
        env:
          ASSET_NAME: Clip-${{ needs.prepare-release.outputs.version }}-${{ matrix.asset_suffix }}
        run: |
          ditto -c -k --keepParent "build/Clip.app" "build/${ASSET_NAME}"

      - name: Upload asset to release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: Clip-${{ needs.prepare-release.outputs.version }}-${{ matrix.asset_suffix }}
        run: gh release upload "${{ needs.prepare-release.outputs.tag }}" "build/${ASSET_NAME}" --clobber

  build-linux-and-windows:
    name: Build ${{ matrix.target_name }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_name: linux-amd64
            runner: ubuntu-latest
            build_script: ./script/build-linux-amd64.sh
            archive_kind: tar.gz
            binary_name: clip-linux-amd64
            apt_packages: libayatana-appindicator3-dev libgtk-3-dev
          - target_name: linux-arm64
            runner: ubuntu-24.04-arm
            build_script: ./script/build-linux-arm64.sh
            archive_kind: tar.gz
            binary_name: clip-linux-arm64
            apt_packages: libayatana-appindicator3-dev libgtk-3-dev
          - target_name: windows-amd64
            runner: ubuntu-latest
            build_script: ./script/build-win-amd64.sh
            archive_kind: zip
            binary_name: clip-windows-amd64.exe
            apt_packages: ""
          - target_name: windows-arm64
            runner: ubuntu-latest
            build_script: ./script/build-win-arm64.sh
            archive_kind: zip
            binary_name: clip-windows-arm64.exe
            apt_packages: ""
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Linux build dependencies
        if: matrix.apt_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Make scripts executable
        run: chmod +x script/*.sh

      - name: Run packaging script
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: ${{ matrix.build_script }}

      - name: Archive build artifact
        env:
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          asset_path="build/clip-${VERSION}-${{ matrix.target_name }}.${{ matrix.archive_kind }}"
          if [ "${{ matrix.archive_kind }}" = "tar.gz" ]; then
            tar -czf "${asset_path}" -C build "${{ matrix.binary_name }}"
          else
            zip -j "${asset_path}" "build/${{ matrix.binary_name }}"
          fi
          echo "ASSET_PATH=${asset_path}" >> "$GITHUB_ENV"

      - name: Upload asset to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.prepare-release.outputs.tag }}" "${ASSET_PATH}" --clobber
